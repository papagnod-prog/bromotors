<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" fill="white"/>
  
  <!-- Silhouette auto sportiva stile coupé (simile al logo BroMotors originale) -->
  <!-- Corpo auto -->
  <g transform="translate(30, 60)">
    <!-- Corpo principale nero -->
    <path d="
      M 20 220
      L 20 200
      L 45 185
      L 75 175
      L 110 140
      L 175 115
      L 250 108
      L 310 110
      L 370 120
      L 410 145
      L 430 165
      L 440 200
      L 440 220
      Z
    " fill="#1a1a1a"/>
    
    <!-- Finestrini (grigio chiaro) -->
    <path d="
      M 112 142
      L 140 122
      L 175 117
      L 250 112
      L 305 114
      L 340 128
      L 355 145
      L 305 148
      L 250 150
      L 175 150
      L 130 150
      Z
    " fill="#cccccc" opacity="0.6"/>
    
    <!-- Pilastro B -->
    <rect x="248" y="112" width="14" height="40" fill="#1a1a1a"/>
    
    <!-- Striscia arancione laterale -->
    <path d="
      M 30 195 L 60 188 L 200 184 L 340 184 L 410 192 L 430 205
      L 415 215 L 340 208 L 200 208 L 60 210 L 30 210 Z
    " fill="#FF6B00"/>
    
    <!-- Passaruota anteriore -->
    <ellipse cx="115" cy="225" rx="55" ry="30" fill="#1a1a1a"/>
    <!-- Passaruota posteriore -->
    <ellipse cx="355" cy="225" rx="55" ry="30" fill="#1a1a1a"/>
    
    <!-- Ruota anteriore -->
    <circle cx="115" cy="235" r="40" fill="#222222"/>
    <circle cx="115" cy="235" r="25" fill="#999999"/>
    <circle cx="115" cy="235" r="12" fill="#444444"/>
    <!-- Razze ant -->
    <line x1="115" y1="213" x2="115" y2="223" stroke="#555" stroke-width="5"/>
    <line x1="115" y1="247" x2="115" y2="257" stroke="#555" stroke-width="5"/>
    <line x1="93"  y1="235" x2="103" y2="235" stroke="#555" stroke-width="5"/>
    <line x1="127" y1="235" x2="137" y2="235" stroke="#555" stroke-width="5"/>
    <line x1="100" y1="220" x2="107" y2="227" stroke="#555" stroke-width="5"/>
    <line x1="123" y1="243" x2="130" y2="250" stroke="#555" stroke-width="5"/>
    
    <!-- Ruota posteriore -->
    <circle cx="355" cy="235" r="40" fill="#222222"/>
    <circle cx="355" cy="235" r="25" fill="#999999"/>
    <circle cx="355" cy="235" r="12" fill="#444444"/>
    <!-- Razze post -->
    <line x1="355" y1="213" x2="355" y2="223" stroke="#555" stroke-width="5"/>
    <line x1="355" y1="247" x2="355" y2="257" stroke="#555" stroke-width="5"/>
    <line x1="333" y1="235" x2="343" y2="235" stroke="#555" stroke-width="5"/>
    <line x1="367" y1="235" x2="377" y2="235" stroke="#555" stroke-width="5"/>
    <line x1="340" y1="220" x2="347" y2="227" stroke="#555" stroke-width="5"/>
    <line x1="363" y1="243" x2="370" y2="250" stroke="#555" stroke-width="5"/>
    
    <!-- Faro anteriore arancione -->
    <ellipse cx="28" cy="192" rx="12" ry="7" fill="#FF6B00"/>
    <!-- Fanale posteriore arancione -->
    <path d="M 428 175 L 442 185 L 438 200 L 424 195 Z" fill="#FF6B00"/>
    
    <!-- Linee eleganti tetto (stile sportivo) -->
    <path d="M 175 115 Q 250 95 310 110" fill="none" stroke="#FF6B00" stroke-width="3" opacity="0.5"/>
  </g>
  
  <!-- Testo BRO arancione -->
  <text x="250" y="385" 
        font-family="Arial Black, Arial, sans-serif" 
        font-size="145" 
        font-weight="900"
        fill="#FF6B00"
        text-anchor="middle"
        letter-spacing="-2">BRO</text>
  
  <!-- Testo MOTORS nero -->
  <text x="250" y="470" 
        font-family="Arial Black, Arial, sans-serif" 
        font-size="88" 
        font-weight="900"
        fill="#1a1a1a"
        text-anchor="middle"
        letter-spacing="4">MOTORS</text>
</svg>