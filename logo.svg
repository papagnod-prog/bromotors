<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <rect width="600" height="600" fill="white"/>

  <!-- Silhouette auto sportiva stile coupé - linee fluide -->
  <g transform="translate(60, 80)">

    <!-- Corpo auto - forma principale nera -->
    <path d="
      M 10,240
      C 10,240 10,210 20,200
      C 30,190 55,182 80,172
      C 105,162 125,135 160,120
      C 195,105 230,100 280,97
      C 330,94 365,97 400,108
      C 420,114 440,128 455,148
      C 465,162 470,185 470,205
      C 470,220 470,240 470,240
      Z
    " fill="#1a1a1a"/>

    <!-- Tetto / linea tetto fluida (parte superiore della silhouette) -->
    <path d="
      M 80,172
      C 100,162 125,138 160,120
      C 195,105 230,98 280,96
      C 330,94 365,97 400,108
      C 420,114 438,126 450,142
      C 420,135 380,128 330,126
      C 280,124 230,126 190,130
      C 150,134 118,148 95,162
      Z
    " fill="#1a1a1a"/>

    <!-- Linee eleganti tetto - highlight arancione sottile -->
    <path d="
      M 82,170
      C 110,155 145,132 185,120
      C 225,108 268,103 310,102
      C 350,101 385,105 415,116
    " fill="none" stroke="#FF6B00" stroke-width="4" stroke-linecap="round" opacity="0.9"/>

    <!-- Seconda linea curva tetto (ala posteriore) -->
    <path d="
      M 390,105
      C 420,108 445,120 462,140
      C 468,148 470,155 468,162
    " fill="none" stroke="#FF6B00" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

    <!-- Parabrezza/finestrini zona grigio chiaro -->
    <path d="
      M 162,122
      C 185,110 218,103 260,100
      C 300,98 335,100 365,110
      C 385,118 400,130 408,145
      C 390,148 360,150 320,152
      C 280,154 240,154 205,153
      C 175,152 155,148 148,140
      Z
    " fill="#dddddd" opacity="0.65"/>

    <!-- Pilastro B (divisore finestrini) -->
    <rect x="302" y="100" width="16" height="55" fill="#1a1a1a" rx="2"/>

    <!-- Ruota anteriore -->
    <circle cx="130" cy="248" r="52" fill="#222"/>
    <circle cx="130" cy="248" r="32" fill="#888"/>
    <circle cx="130" cy="248" r="16" fill="#333"/>
    <!-- Razze ant -->
    <line x1="130" y1="218" x2="130" y2="232" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <line x1="130" y1="264" x2="130" y2="278" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <line x1="100" y1="248" x2="114" y2="248" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <line x1="146" y1="248" x2="160" y2="248" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <line x1="109" y1="227" x2="119" y2="237" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <line x1="141" y1="259" x2="151" y2="269" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <line x1="151" y1="227" x2="141" y2="237" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <line x1="119" y1="259" x2="109" y2="269" stroke="#555" stroke-width="6" stroke-linecap="round"/>

    <!-- Ruota posteriore -->
    <circle cx="375" cy="248" r="52" fill="#222"/>
    <circle cx="375" cy="248" r="32" fill="#888"/>
    <circle cx="375" cy="248" r="16" fill="#333"/>
    <!-- Razze post -->
    <line x1="375" y1="218" x2="375" y2="232" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <line x1="375" y1="264" x2="375" y2="278" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <line x1="345" y1="248" x2="359" y2="248" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <line x1="391" y1="248" x2="405" y2="248" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <line x1="354" y1="227" x2="364" y2="237" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <line x1="386" y1="259" x2="396" y2="269" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <line x1="396" y1="227" x2="386" y2="237" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <line x1="364" y1="259" x2="354" y2="269" stroke="#555" stroke-width="6" stroke-linecap="round"/>

    <!-- Passaruote (archi) -->
    <path d="M 78,248 A 52,30 0 0,1 182,248" fill="#1a1a1a"/>
    <path d="M 323,248 A 52,30 0 0,1 427,248" fill="#1a1a1a"/>

    <!-- Faro anteriore arancione -->
    <path d="M 18,195 C 22,188 30,184 40,186 C 45,195 40,202 32,203 C 24,204 16,200 18,195 Z" fill="#FF6B00"/>

    <!-- Fanale posteriore arancione -->
    <path d="M 458,148 C 466,155 470,165 468,175 C 465,182 458,186 452,182 C 458,170 460,158 458,148 Z" fill="#FF6B00"/>

  </g>

  <!-- Testo BRO arancione bold -->
  <text x="300" y="440"
        font-family="'Arial Black', 'Arial', sans-serif"
        font-size="175"
        font-weight="900"
        fill="#FF6B00"
        text-anchor="middle"
        letter-spacing="-3">BRO</text>

  <!-- Testo MOTORS nero bold -->
  <text x="300" y="548"
        font-family="'Arial Black', 'Arial', sans-serif"
        font-size="100"
        font-weight="900"
        fill="#1a1a1a"
        text-anchor="middle"
        letter-spacing="6">MOTORS</text>
</svg>
